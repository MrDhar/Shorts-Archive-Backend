services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DOWNLOAD_ROOT: /data/downloads
      YTDL_POT_PROVIDER_URL: http://bgutil-provider:4416
      YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
    volumes:
      - ./data:/data
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    init: true
    expose:
      - "4416"
