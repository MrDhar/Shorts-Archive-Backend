name: Upload Queue Worker

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Trigger upload worker
        env:
          WORKER_SECRET: ${{ secrets.UPLOAD_WORKER_SECRET }}
        run: |
          set -u

          url="https://shorts-archive-backend.onrender.com/upload-queue/run"

          attempt=1
          max_attempts=12

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Worker request attempt $attempt/$max_attempts"

            set +e
            status="$(curl \
              --silent \
              --show-error \
              --output /tmp/worker-response.txt \
              --write-out '%{http_code}' \
              --connect-timeout 30 \
              --max-time 300 \
              -X POST \
              -H "X-Worker-Secret: ${WORKER_SECRET}" \
              -H "Content-Length: 0" \
              "$url")"
            curl_exit=$?
            set -e

            if [ -f /tmp/worker-response.txt ]; then
              cat /tmp/worker-response.txt
            fi

            echo
            echo "curl exit code: $curl_exit"
            echo "HTTP status: $status"

            if [ "$curl_exit" -eq 0 ]; then
              case "$status" in
                2??)
                  echo "Worker completed successfully."
                  exit 0
                  ;;

                502|503|504)
                  echo "Temporary Render HTTP $status."
                  ;;

                *)
                  echo "Worker returned non-retryable HTTP status: $status" >&2
                  exit 1
                  ;;
              esac
            else
              echo "Transient curl/network failure (exit $curl_exit)."
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Worker failed after all retries." >&2
              exit 1
            fi

            echo "Retrying in 15 seconds..."
            sleep 15
            attempt=$((attempt + 1))
          done
