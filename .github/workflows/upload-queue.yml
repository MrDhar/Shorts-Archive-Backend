name: Upload Queue Worker

on:
  schedule:
    # Run every 15 minutes, offset from the start of the hour
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Trigger upload worker
        env:
          WORKER_SECRET: ${{ secrets.UPLOAD_WORKER_SECRET }}
        run: |
          set -eu

          url="https://shorts-archive-backend.onrender.com/upload-queue/run"

          attempt=1
          max_attempts=12

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Worker request attempt $attempt/$max_attempts"

            status="$(curl \
              --silent \
              --show-error \
              --output /tmp/worker-response.txt \
              --write-out '%{http_code}' \
              --max-time 120 \
              -X POST \
              -H "X-Worker-Secret: ${WORKER_SECRET}" \
              -H "Content-Length: 0" \
              "$url" || true)"

            cat /tmp/worker-response.txt || true
            echo
            echo "HTTP status: $status"

            case "$status" in
              2??)
                echo "Worker completed successfully."
                exit 0
                ;;

              502|503|504)
                if [ "$attempt" -eq "$max_attempts" ]; then
                  echo "Render did not become available after retries." >&2
                  exit 1
                fi

                echo "Temporary Render/network error. Retrying in 15 seconds..."
                sleep 15
                ;;

              *)
                echo "Worker returned non-retryable HTTP status: $status" >&2
                exit 1
                ;;
            esac

            attempt=$((attempt + 1))
          done
